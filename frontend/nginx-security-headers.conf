# Security response headers — docs/07 §3.9, docs/10 §3.8.
#
# This is a separate file because of one nginx rule that is very easy to get wrong:
# `add_header` directives are inherited from the enclosing block **only while the inner
# block declares none of its own**. A single `add_header Cache-Control ...` inside a
# `location` therefore discards every security header set at `server` level — silently,
# with no warning at config test and a perfectly healthy-looking 200 in the browser.
#
# That is exactly what happened here: all five headers were declared once at server
# level, all three locations set their own caching header, and the image shipped with no
# CSP at all. Keeping them in an include that every location pulls in makes the
# inheritance question moot rather than subtle.

# `connect-src` is doing real work: it is what stops an injected script from posting a
# customer record somewhere else. It cannot be `'self'` alone, though — that was a bug
# that shipped, and it broke sign-in completely.
#
# The PKCE flow exchanges its authorization code by POSTing to Cognito's `/oauth2/token`
# on the hosted UI domain, from the browser. Under `connect-src 'self'` that fetch is
# refused, so the redirect back from Cognito succeeds, the code arrives, and the exchange
# then fails with "Failed to fetch" — an error that points at the network and not at the
# policy that caused it.
#
# It never appeared in development because Vite's dev server sends none of these headers;
# the policy exists only in this container. Same shape as the Google Fonts problem: a
# thing that is correct locally and broken exactly where nobody is watching.
#
# `@CSP_CONNECT_SRC@` is substituted at container start (docker-entrypoint.d/25-csp.sh)
# and defaults to `'self'`, so an image with no configuration is still locked down. The
# task definition supplies the specific Cognito hosts — not a wildcard, and not `*`.
#
# The placeholder is `@NAME@` rather than `${NAME}` because nginx parses `${...}` inside a
# quoted value as one of its own variables, and `nginx -t` then rejects the config at
# build time with "unknown variable". `@` means nothing to nginx, so the file is valid
# both before and after substitution — which is what lets the build validate it.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src @CSP_CONNECT_SRC@; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
