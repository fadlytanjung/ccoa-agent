# Security response headers — docs/07 §3.9, docs/10 §3.8.
#
# This is a separate file because of one nginx rule that is very easy to get wrong:
# `add_header` directives are inherited from the enclosing block **only while the inner
# block declares none of its own**. A single `add_header Cache-Control ...` inside a
# `location` therefore discards every security header set at `server` level — silently,
# with no warning at config test and a perfectly healthy-looking 200 in the browser.
#
# That is exactly what happened here: all five headers were declared once at server
# level, all three locations set their own caching header, and the image shipped with no
# CSP at all. Keeping them in an include that every location pulls in makes the
# inheritance question moot rather than subtle.

# `connect-src 'self'` is doing real work: it is what stops an injected script from
# posting a customer record somewhere else. The API is same-origin behind the ALB, so
# nothing legitimate needs a wider policy.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
