# Static serving for the SPA — docs/07 §3.9.
#
# Every `location` includes the security-header snippet. That repetition is deliberate:
# see the comment in nginx-security-headers.conf for why declaring them once at server
# level does not work.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # A container that cannot say whether it is healthy cannot be scaled to zero
    # safely, so this is a target-group requirement rather than a nicety.
    location = /healthz {
        access_log off;
        include /etc/nginx/security-headers.conf;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Content-hashed filenames, so these can be cached hard and for a long time. The
    # max-age is written into the one Cache-Control rather than left to `expires`, which
    # would emit a second, competing Cache-Control alongside it.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html is never cached: it is what points at the hashed assets, and a stale
    # copy pins the whole application to a previous deploy.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
        # SPA fallback — client-side routes are not files on disk.
        try_files $uri $uri/ /index.html;
    }
}
