# Validate and test — docs/11 §3.2.
#
# **Why this is separate from deploy.yml.** They answer different questions and run at
# different moments. This one runs on every branch and every pull request and asks "is this
# change sound?"; it needs no credentials and can safely run on a fork. `deploy.yml` runs
# only on `main`, assumes an AWS role, and asks "should this become the running system?".
# Merging them would mean either granting deploy credentials to pull-request runs — which
# is how a fork gets to assume your role — or carrying a large `if:` on every step.
#
# **Nothing runs that the change cannot affect.** A frontend-only change runs frontend
# jobs; a docs-only change runs the repository checks and stops. The `changes` job below
# computes that once and every other job keys off it.
#
# Agent evaluations are deliberately absent. They call a real model, cost money per run,
# and a failure needs a person to decide whether the agent regressed or the expectation
# was wrong — a judgement that gets skipped when it blocks a merge (docs/19 §3.1).
#
# Actions are pinned to a major tag verified against `git/ref/tags`, not against a release
# name: `astral-sh/setup-uv` publishes releases up to v10 while its newest floating major
# tag is v7, so `@v10` fails to resolve. A stale pin fails on the first run with an error
# about the runner rather than about the pin.
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      terraform: ${{ steps.filter.outputs.terraform }}
      images: ${{ steps.filter.outputs.images }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"

          # A first push, or a force-push past the recorded base, leaves nothing to diff
          # against. Run everything rather than guess — the failure mode of guessing wrong
          # is a change that reached main untested.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base" 2>/dev/null; then
            echo "no usable base commit — running everything"
            for k in backend frontend terraform images; do echo "$k=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          fi

          files="$(git diff --name-only "$base" HEAD)"
          echo "changed files:"; echo "$files" | sed 's/^/  /'

          match() { echo "$files" | grep -qE "$1"; }

          # The workflow itself counts as a change to everything it runs: editing a job
          # must exercise that job, or the edit is untested until something else happens
          # to touch the same area.
          workflow='^\.github/workflows/ci\.yml$'

          match "^backend/|$workflow"                  && b=true || b=false
          match "^frontend/|$workflow"                 && f=true || f=false
          match "^terraform/|$workflow"                && t=true || t=false
          # Anything that can change what ends up inside an image.
          match "^(backend|frontend)/|$workflow"       && i=true || i=false

          {
            echo "backend=$b"
            echo "frontend=$f"
            echo "terraform=$t"
            echo "images=$i"
          } >> "$GITHUB_OUTPUT"

  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy app

      - name: Seed the corpus
        # Deterministic, so this is the same corpus the tests were written against
        # (docs/12 §3.2). The command migrates first — it did not always, and every
        # caller but the Dockerfile broke on a fresh checkout.
        run: uv run python -m app.seed --reset

      - name: Tests
        run: uv run pytest -q

      - name: No inline prompts
        # Prompts belong in SKILL.md and drift back into Python one "just this once" at a
        # time (docs/17 §3.9).
        run: uv run python tools/check_no_inline_prompts.py

      - name: Migrations match the models
        run: DATABASE_URL="sqlite+pysqlite:///$(pwd)/data/app.db" uv run alembic check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Types
        run: npx tsc -b --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npm run build

  browser:
    name: Browser
    runs-on: ubuntu-latest
    needs: [changes, backend, frontend]
    # `always()` because `needs` on a skipped job would otherwise skip this too, and a
    # frontend-only change still wants the browser tier — it drives a real backend.
    if: |
      always()
      && needs.changes.outputs.images == 'true'
      && needs.backend.result != 'failure'
      && needs.frontend.result != 'failure'
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare the backend
        working-directory: backend
        run: |
          uv python install ${{ env.PYTHON_VERSION }}
          uv sync --locked
          uv run python -m app.seed --reset

      - name: Prepare the frontend
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Browser and phone tests
        working-directory: frontend
        # No GEMINI_API_KEY, so the `@live` specs skip and the token-free tier still runs.
        # A fork's pull request cannot read secrets anyway, and a suite that fails for
        # contributors is a suite people learn to ignore.
        run: npx playwright test

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  containers:
    name: Containers
    runs-on: ubuntu-latest
    needs: [changes, backend, frontend]
    if: |
      always()
      && needs.changes.outputs.images == 'true'
      && needs.backend.result != 'failure'
      && needs.frontend.result != 'failure'
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # Both scripts test properties that are **silent** when broken: a container that
      # never restores its database still boots, still passes every health check, and
      # serves the corpus baked in at build time (ADR-007); and an `add_header` inside an
      # nginx `location` discards every inherited one, so a CSP declared at server level
      # can reach no response at all (docs/07 §3.9). Both have happened here.
      - name: Build the backend image
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          load: true
          tags: ccoa-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Verify durable replication
        if: needs.changes.outputs.backend == 'true'
        working-directory: backend
        run: ./docker/verify-replication.sh ccoa-backend:ci

      - name: Build the frontend image
        if: needs.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: false
          load: true
          tags: ccoa-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Verify what the image serves
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: ./docker/verify-image.sh ccoa-frontend:ci

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.terraform == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - name: Format
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Validate
        working-directory: terraform
        # `-backend=false`: this validates the configuration, which is all a pull request
        # can check without touching an account.
        run: |
          terraform init -backend=false -input=false
          terraform validate

  repository:
    name: Repository
    runs-on: ubuntu-latest
    # No `if:` — these run on every change, including documentation-only ones. A secret
    # or an account id is most often leaked in a document.
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans history, and history is where a leaked key actually lives.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: No account identifiers
        # This repository is public, and git does not forget (docs/18 §6).
        run: python3 tools/check_no_account_identifiers.py

      - name: Implementation status is current
        run: python3 tools/check_implementation_status.py

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
