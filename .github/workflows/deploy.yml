# Build, push, and deploy — docs/11 §3.5, §3.6.
#
# Runs on `main` only. `develop` gets CI; merging to `main` is what releases, so one
# branch owns the environment. Both branches share a Terraform state file, and deploying
# from both means whichever pushed last rewrites the environment in its own image — that
# is not theoretical, it nearly replaced a working load balancer here (docs/11 §3.7).
#
# **Each service is tagged by the last commit that touched it**, not by the head commit.
# A frontend-only change therefore leaves the backend's tag exactly as it was, Terraform
# sees no difference, and ECS does not replace a task that has not changed. That matters
# more than it sounds: replacing the backend means a brief outage by design, because two
# backend tasks would be two divergent databases (docs/04 §3.5).
#
# What is deliberately absent: agent evaluations and the `@live` browser specs. Both spend
# model tokens, and an eval failure needs a person to judge whether the agent regressed or
# the expectation was wrong — a judgement that gets skipped in a deploy path (docs/19 §3.1).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never two deploys at once: they race on the state lock and the loser fails with an error
# that looks like a bug. Not cancel-in-progress — abandoning a half-finished apply is worse
# than queueing behind it.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # to mint the OIDC token that assumes the AWS role

env:
  AWS_REGION: ap-southeast-1
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.tags.outputs.backend }}
      frontend: ${{ steps.tags.outputs.frontend }}
      backend_tag: ${{ steps.tags.outputs.backend_tag }}
      frontend_tag: ${{ steps.tags.outputs.frontend_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: tags
        run: |
          # The last commit that touched each service. Deterministic, and it makes an
          # image tag mean "these bytes", so an unchanged service resolves to the tag it
          # already has in ECR and nothing is rebuilt or redeployed.
          backend_tag="$(git log -1 --format=%H -- backend)"
          frontend_tag="$(git log -1 --format=%H -- frontend)"

          base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base" 2>/dev/null; then
            b=true; f=true
          else
            files="$(git diff --name-only "$base" HEAD)"
            echo "$files" | grep -qE '^backend/'  && b=true || b=false
            echo "$files" | grep -qE '^frontend/' && f=true || f=false
          fi

          {
            echo "backend=$b"
            echo "frontend=$f"
            echo "backend_tag=$backend_tag"
            echo "frontend_tag=$frontend_tag"
          } >> "$GITHUB_OUTPUT"

          echo "backend  changed=$b  tag=${backend_tag:0:12}"
          echo "frontend changed=$f  tag=${frontend_tag:0:12}"

  check:
    name: Check
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        if: needs.changes.outputs.backend == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v7
        if: needs.changes.outputs.frontend == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The merge gate already ran the full suite on the pull request. This re-runs only
      # what would be embarrassing to deploy past, and only for what changed.
      - name: Backend
        if: needs.changes.outputs.backend == 'true'
        working-directory: backend
        run: |
          uv python install ${{ env.PYTHON_VERSION }}
          uv sync --locked
          uv run ruff check .
          uv run mypy app
          uv run python -m app.seed --reset
          uv run pytest -q
          uv run python tools/check_no_inline_prompts.py

      - name: Frontend
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          npm ci
          npx tsc -b --noEmit
          npm run lint
          npx vitest run
          npm run build

      - name: Repository
        run: |
          python3 tools/check_no_account_identifiers.py
          python3 tools/check_implementation_status.py

  deploy:
    name: Deploy dev
    runs-on: ubuntu-latest
    needs: [changes, check]
    environment: dev
    outputs:
      app_url: ${{ steps.outputs.outputs.app_url }}
    steps:
      - uses: actions/checkout@v7

      # No access keys anywhere. The role is assumed with a short-lived OIDC token, and
      # its trust policy is scoped by `sub` to this repository — including the permanent
      # numeric ids GitHub started emitting on 2026-07-15, without which the assume fails
      # with a message about authorisation rather than about the claim (docs/18 §4).
      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - name: Terraform init
        working-directory: terraform
        run: |
          # The bucket name contains the account id, so it is read from the caller's own
          # identity rather than written into a file this public repository holds.
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          terraform init -reconfigure -input=false \
            -backend-config="bucket=ccoa-tfstate-${ACCOUNT_ID}" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform format and validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform validate

      - name: Ensure the repositories exist
        working-directory: terraform
        # Nothing can be pushed to a repository that does not exist, and the services
        # cannot start without images — so this is separate from the apply below.
        run: |
          terraform apply -input=false -auto-approve \
            -var-file=envs/dev.tfvars \
            -var="backend_image_tag=${{ needs.changes.outputs.backend_tag }}" \
            -var="frontend_image_tag=${{ needs.changes.outputs.frontend_tag }}" \
            -target=aws_ecr_repository.backend \
            -target=aws_ecr_repository.frontend

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v4

      # Skipped when the tag is already in ECR. That covers both an unchanged service and
      # a re-run of the same commit — and the repositories are IMMUTABLE, so pushing an
      # existing tag would fail rather than overwrite.
      - name: Is the backend image already built?
        id: backend_image
        run: |
          if aws ecr describe-images --repository-name ccoa-dev-backend \
               --image-ids imageTag=${{ needs.changes.outputs.backend_tag }} >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "backend image already in ECR — skipping build"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Is the frontend image already built?
        id: frontend_image
        run: |
          if aws ecr describe-images --repository-name ccoa-dev-frontend \
               --image-ids imageTag=${{ needs.changes.outputs.frontend_tag }} >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "frontend image already in ECR — skipping build"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # ARM64, matching `runtime_platform` in the task definitions. A runner is amd64, so
      # this needs an explicit platform — get it wrong and the task dies with
      # `exec format error`, which names neither the cause nor the fix.
      - name: Build and push the backend
        if: steps.backend_image.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: backend
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/ccoa-dev-backend:${{ needs.changes.outputs.backend_tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push the frontend
        if: steps.frontend_image.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: frontend
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/ccoa-dev-frontend:${{ needs.changes.outputs.frontend_tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Apply
        working-directory: terraform
        # Both tags are always passed. Terraform is declarative: an unchanged tag produces
        # no diff, so the service that did not change is not touched.
        run: |
          terraform apply -input=false -auto-approve \
            -var-file=envs/dev.tfvars \
            -var="backend_image_tag=${{ needs.changes.outputs.backend_tag }}" \
            -var="frontend_image_tag=${{ needs.changes.outputs.frontend_tag }}"

      - name: Collect outputs
        id: outputs
        working-directory: terraform
        run: |
          echo "app_url=$(terraform output -raw app_url)" >> "$GITHUB_OUTPUT"
          # Whether the environment knowingly runs a certificate nothing vouches for. The
          # smoke test needs it: curl rejects one, and a rejected connection reports
          # http_code 000, which reads as "the app is down".
          echo "self_signed=$(terraform output -json edge | jq -r .self_signed_certificate)" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        env:
          APP_URL: ${{ steps.outputs.outputs.app_url }}
          SELF_SIGNED: ${{ steps.outputs.outputs.self_signed }}
        run: |
          # `-k` only when Terraform says the certificate is self-signed. Unconditional
          # would turn a genuine TLS failure into a green build.
          INSECURE=""
          if [ "$SELF_SIGNED" = "true" ]; then
            INSECURE="-k"
            echo "::warning::Verifying against a self-signed certificate. Set acm_certificate_arn to remove this."
          fi
          code() { curl -s $INSECURE -o /dev/null -w '%{http_code}' --max-time 10 "$1"; }

          # Bounded. A backend replacement is a brief outage by design, so a short gap is
          # expected; past two and a half minutes the answer is in the logs.
          deadline=$(( SECONDS + 150 ))
          until [ "$(code "$APP_URL/api/v1/config")" = "200" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::no 200 from $APP_URL within 150s"
              aws logs tail "/ecs/ccoa-dev/backend" --since 5m || true
              exit 1
            fi
            sleep 5
          done
          echo "responding after ${SECONDS}s"

          fail=0
          expect() {
            if [ "$3" = "$2" ]; then echo "ok   $1 ($3)"; else echo "::error::$1 — got $3, wanted $2"; fail=1; fi
          }
          expect "the SPA is served"         200 "$(code "$APP_URL/")"
          expect "a client route falls back" 200 "$(code "$APP_URL/threads/th_example")"
          # Reaching the edge grants nothing — the trust boundary is the token, not the
          # network (docs/09 §3).
          expect "the API rejects anonymous" 401 "$(code "$APP_URL/api/v1/threads")"
          expect "public config is readable" 200 "$(code "$APP_URL/api/v1/config")"

          # The CSP must name the identity provider, or the PKCE token exchange is refused
          # by the browser *after* a sign-in that appeared to work (docs/07 §3.9).
          csp="$(curl -s $INSECURE -I --max-time 10 "$APP_URL/" | tr -d '\r' | grep -i '^content-security-policy' || true)"
          case "$csp" in
            *amazoncognito.com*) echo "ok   the CSP allows the identity provider" ;;
            *) echo "::error::CSP would block sign-in: $csp"; fail=1 ;;
          esac

          exit $fail

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deployed to \`dev\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| App | ${{ steps.outputs.outputs.app_url }} |"
            echo "| Backend | \`${{ needs.changes.outputs.backend_tag }}\` (changed: ${{ needs.changes.outputs.backend }}) |"
            echo "| Frontend | \`${{ needs.changes.outputs.frontend_tag }}\` (changed: ${{ needs.changes.outputs.frontend }}) |"
            echo ""
            echo "\`dev\` is ephemeral — \`./scripts/destroy.sh\` when idle."
          } >> "$GITHUB_STEP_SUMMARY"

  prod:
    name: Deploy prod (never approved)
    runs-on: ubuntu-latest
    needs: [deploy]
    # An environment with no approvers. The job exists so that "the design supports
    # production" is checkable rather than asserted, and so approving it would be a
    # deliberate act somebody has to perform. It never is (docs/00 §5, ADR-006 §2).
    environment: prod
    if: false
    steps:
      - run: echo "prod is configuration only. See docs/00 §5."
